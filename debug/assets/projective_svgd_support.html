<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SVGD support 3D</title>
<link rel="stylesheet" href="projective_theme.css">
<style>#banners .b{padding:3px 6px;margin:3px 0;border-radius:4px;background:#21262d;font-size:11px}#banners .b.bad{border-left:3px solid var(--bad)}#banners .b.warn{border-left:3px solid var(--warn)}

<script src="three.min.js"></script><script src="projective_common.js"></script></head>
<body class="app"><div id="app">
<div id="view"><div id="hud"></div>
 <div id="bar"><button id="play">play</button><button id="first">|&lt;</button><button id="prev">&lt;</button><button id="next">&gt;</button>
  <input id="frame" type="range" min="0" value="0" step="1"><span id="flabel"></span>
  <label class="inline">speed × real time <select id="speed"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label></div></div>
<div id="side" class="wide">
 <h1>SVGD moving support — 3D (<span id="level"></span>)</h1><div id="errors"></div><div id="banners"></div>
 <h2>This frame</h2><div id="counts"></div>
 <h2>Show</h2><div id="toggles"></div>
 <h2>Cameras</h2><div id="cams"></div>
 <label>view from <select id="viewfrom" style="flex:1"><option value="-1">free orbit</option></select></label>
 <label>point size <input id="psize" type="range" min="0.3" max="3" step="0.1" value="1" style="flex:1"></label>
 <label>canonical <select id="cmode"><option value="gray">stationary gray</option><option value="rgb">measured RGB (frame 0)</option></select></label>
 <label>observed <select id="omode"><option value="rgb">measured RGB</option><option value="cam">camera</option></select></label>
 <h2>Transported colour</h2><select id="mode"></select><div id="legend" style="margin-top:6px"></div><div id="lsem" class="note"></div>
 <h2>Rigidity candidate edges</h2><div class="note" id="enote"></div><select id="emode"><option value="strain">max |strain| (m)</option><option value="chi2">rigid χ²/dof</option>
  <option value="bound">boundary disagreement |Δ layer|</option><option value="rho">rho (same-rigid posterior)</option></select><div id="elegend"></div>
 <h2>Traced vectors</h2><div class="note" id="vnote"></div>
 <label>outer iteration <select id="iter"></select></label>
 <label>field scale <input id="vscale" type="range" min="-2" max="2" step="0.1" value="0" style="flex:1"></label><label>step × <select id="sscale"><option>1</option><option selected>10</option><option>100</option><option>1000</option></select></label>
 <div id="vexpl"></div>
 <h2>Selected original ID</h2><input id="pid" type="text" size="9" placeholder="original id"> <a id="nlink" href="svgd_support_numerical.html">numerical trace</a>
 <div id="info" class="note">click a point (transported or canonical), pick a traced ID, or enter an ID</div><div id="tids" class="note"></div>
</div></div>

  $('tids').innerHTML = 'traced: ' + M.traced_ids.map(i => `<a href="#" data-id="${i}">${i}</a>`).join(' ') + (M.seeds ? ` · seeds ${M.seeds.ids.length}` : '');
