<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Bidirectional</title>
<link rel="stylesheet" href="projective_theme.css">
<script src="three.min.js"></script><script src="projective_common.js"></script></head>
<body class="app"><div id="app"><div id="view"></div><div id="side" class="wide"><h1>Forward vs backward (common calibrated world; no point links, no fused posterior)</h1><div id="errors"></div><div id="legend"></div><pre id="cmp"></pre></div></div>
<script>
const DIRS = __DIRECTIONS__, state = {}; window.__state = state;
(async () => {
  const B = await PD.load('bidirectional'), V = PD.viewer(document.getElementById('view')); const cols = {forward: PD.hex3('#58a6ff'), backward: PD.hex3('#f0883e')}; let fitted = false;
  for (const d of DIRS) { let J; try { J = await PD.load('joint_'+d); } catch (e) { continue; } if (!J.xyz) continue;
    const p = PD.f32(J.xyz), c = new Float32Array(p.length); for (let i = 0; i < p.length; i += 3) c.set(cols[d], i); if (!fitted) { V.fit(p); fitted = true; } V.scene.add(PD.points(p, c, V.state.radius*.008, .8));
    const cand = (J.joint.candidates || {})[J.joint.status]; if (cand) { const e = cand.axis, a = cand.axis_point || [p[0], p[1], p[2]], L = .6;
      V.scene.add(PD.lines([a[0]-L*e[0], a[1]-L*e[1], a[2]-L*e[2], a[0]+L*e[0], a[1]+L*e[1], a[2]+L*e[2]], d === 'forward' ? 0x58a6ff : 0xf0883e)); } }
  PD.legend(document.getElementById('legend'), [['#58a6ff', 'forward: frame-0 canonical P_0 + its axis'], ['#f0883e', 'backward: frame-T canonical P_T + its axis']]);
  document.getElementById('cmp').textContent = JSON.stringify(B.comparison, null, 1) || 'no comparison (a direction did not reach the joint stage)';
  state.ready = true;
})();
</script></body></html>
