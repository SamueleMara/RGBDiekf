<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rigid __DIRECTION__ 3D</title>
<link rel="stylesheet" href="projective_theme.css">
<script src="three.min.js"></script><script src="projective_common.js"></script></head>
<body class="app"><div id="app">
<div id="view"><div id="hud"></div>
 <div id="bar"><button id="play">play</button><input id="frame" type="range" min="0" value="0" step="1"><span id="flabel"></span></div></div>
<div id="side" class="wide">
 <h1>Rigid pass __DIRECTION__ · one shared SE(3) pose + twist</h1><div id="errors"></div><div id="status" class="note"></div>
 <h2>Show</h2><div id="toggles"></div>
 <label>view from <select id="viewfrom" style="flex:1"><option value="-1">free orbit</option></select></label>
 <label>point size <input id="psize" type="range" min="0.3" max="3" step="0.1" value="1" style="flex:1"></label>
 <h2>This frame</h2><div id="pose"></div>
 <h2>Timelines</h2>
 <canvas id="c1" width="450" height="140"></canvas><canvas id="c2" width="450" height="140"></canvas><canvas id="c3" width="450" height="140"></canvas><canvas id="c4" width="450" height="140"></canvas>
</div></div>
<script>
const DIR = '__DIRECTION__', state = {}; window.__state = state; let D, V, obj = {}, timer = null;
const show = {start: true, est: true, rgb: false, stat: true, track: true, triad: true, cams: false};
const TOG = [['start', 'start core (canonical, T = I, fixed)', '#6e7681'], ['est', 'estimated core  T(t)·x', PD.C.track], ['rgb', 'colour estimated core by measured RGB', '#888'],
  ['stat', 'static-compatible points (occluders only)', '#30363d'], ['track', 'tracked core points with trails', PD.C.spread], ['triad', 'pose triad at the core centroid', '#ff5555'], ['cams', 'camera frustums', PD.C.cam]];
const sz = f => V.state.radius*f*(+document.getElementById('psize').value);
function put(name, o) { if (obj[name]) V.scene.remove(obj[name]); obj[name] = o; if (o) V.scene.add(o); }
const tf = (T, p, i) => [0, 1, 2].map(r => T[r][0]*p[3*i]+T[r][1]*p[3*i+1]+T[r][2]*p[3*i+2]+T[r][3]);
function draw() {
  const k = +document.getElementById('frame').value, T = D.poses[k], ord = D.processing_order, step = ord.indexOf(k);
  const p = PD.f32(D.core_xyz), rgb = PD.u8(D.core_rgb), n = p.length/3, x = new Float32Array(3*n);
  for (let i = 0; i < n; i++) x.set(tf(T, p, i), 3*i);
  put('start', show.start ? PD.points(p, '#565e69', sz(.02)) : null);
  let col = PD.C.track; if (show.rgb) { col = new Float32Array(3*n); for (let i = 0; i < n; i++) col.set([rgb[3*i]/255, rgb[3*i+1]/255, rgb[3*i+2]/255], 3*i); }
  put('est', show.est ? PD.points(x, col, sz(.011)) : null);
  put('stat', show.stat ? PD.points(PD.f32(D.static_xyz), '#3a4049', sz(.011), .5) : null);
  if (show.track) { const seg = [], mk = [];
    D.tracked.forEach(i => { for (let s = 1; s <= step; s++) seg.push(...tf(D.poses[ord[s-1]], p, i), ...tf(D.poses[ord[s]], p, i)); mk.push(...tf(T, p, i)); });
    put('trail', seg.length ? PD.lines(seg, 0xe3b341, .85) : null); put('mk', PD.points(mk, PD.C.spread, sz(.06))); } else { put('trail', null); put('mk', null); }
  if (show.triad) { const c = [0, 0, 0]; for (let i = 0; i < n; i++) for (let r = 0; r < 3; r++) c[r] += x[3*i+r]/n;
    const A = T.map(r => r.slice()); A[0][3] = c[0]; A[1][3] = c[1]; A[2][3] = c[2]; put('triad', PD.axes(A, V.state.radius*.25)); } else put('triad', null);
  if (obj.cams) obj.cams.visible = show.cams;
  const tl = D.timeline.find(r => +r.frame === k);
  document.getElementById('flabel').textContent = `frame ${k} · step ${step}/${D.poses.length-1}` + (k === D.canonical_frame ? ' (canonical, T = I)' : '');
  document.getElementById('hud').innerHTML = `${D.status.pass} ${DIR} · frame ${k} · t ${D.timestamps[k].toFixed(3)} s · |t| ${Math.hypot(T[0][3], T[1][3], T[2][3]).toFixed(4)} m`;
  const f = v => v.toFixed(4);
  PD.rows(document.getElementById('pose'), [['translation (m)', [0, 1, 2].map(r => f(T[r][3])).join(', ')], ['v (m/s)', D.twists[k].slice(0, 3).map(f).join(', ')],
    ['ω (rad/s)', D.twists[k].slice(3).map(f).join(', ')], ['σ τ_v (mm)', D.pose_sigma[k].slice(0, 3).map(v => (1e3*v).toFixed(3)).join(', ')],
    ['σ τ_ω (mrad)', D.pose_sigma[k].slice(3).map(v => (1e3*v).toFixed(3)).join(', ')],
    ...(tl ? [['rows / converged / iterations', `${tl.rows} / ${tl.converged} / ${tl.iterations}`], ['max pair-distance error (m)', (+tl.rigidity_error_m).toExponential(2)], ['NIS per dof (prior)', (+tl.nis_per_dof).toFixed(3)]] : [])]);
  state.frame = k; state.ready = true;
}
(async () => {
  D = await PD.load(`rigid_${DIR}`); const st = D.status;
  document.getElementById('status').innerHTML = `<b class="${st.status === 'COMPLETE' ? 'good' : 'warn'}">${st.status}</b> · ` + Object.entries(st).filter(([a]) => !['status', 'pass'].includes(a)).map(([a, b]) => `${a} ${typeof b === 'object' ? JSON.stringify(b) : b}`).join(' · ');
  if (st.status !== 'COMPLETE') { state.ready = true; return; }
  V = PD.viewer(document.getElementById('view'));
  const cams = new THREE.Group(); D.cameras.forEach(c => cams.add(PD.frustum(c, .2))); cams.visible = false; V.scene.add(cams); obj.cams = cams;
  V.fit(PD.f32(D.static_xyz).length ? new Float32Array([...PD.f32(D.core_xyz), ...PD.f32(D.static_xyz)]) : PD.f32(D.core_xyz));
  const vf = document.getElementById('viewfrom'); D.cameras.forEach((c, i) => vf.add(new Option(c.name, i)));
  vf.onchange = () => { if (+vf.value >= 0) V.lookFrom(D.cameras[+vf.value]); }; vf.value = 0; vf.onchange();
  const tg = document.getElementById('toggles');
  TOG.forEach(([key, text, col]) => tg.insertAdjacentHTML('beforeend', `<label><input type="checkbox" data-k="${key}" ${show[key] ? 'checked' : ''}><span class="sw" style="background:${col}"></span>${text}</label>`));
  tg.querySelectorAll('input').forEach(e => e.onchange = () => { show[e.dataset.k] = e.checked; draw(); });
  const fr = document.getElementById('frame'); fr.max = D.poses.length-1; fr.value = D.canonical_frame; fr.oninput = draw; document.getElementById('psize').oninput = draw;
  const play = document.getElementById('play');
  play.onclick = () => { if (timer) { clearInterval(timer); timer = null; play.textContent = 'play'; return; } play.textContent = 'pause';
    timer = setInterval(() => { const o = D.processing_order; fr.value = o[(o.indexOf(+fr.value)+1) % o.length]; draw(); }, 150); };
  const ks = D.poses.map((_, k) => k), col = ['#ff6b6b', '#3fb950', '#58a6ff'];
  PD.chart(document.getElementById('c1'), [0, 1, 2].map(r => ({x: ks, y: D.poses.map(T => T[r][3]), color: col[r], label: 't'+'xyz'[r]+' (m)'})), {title: 'translation'});
  PD.chart(document.getElementById('c2'), [3, 4, 5].map(r => ({x: ks, y: D.twists.map(t => t[r]), color: col[r-3], label: 'ω'+'xyz'[r-3]+' (rad/s)'})), {title: 'angular velocity'});
  PD.chart(document.getElementById('c3'), [0, 1, 2].map(r => ({x: ks, y: D.twists.map(t => t[r]), color: col[r], label: 'v'+'xyz'[r]+' (m/s)'})), {title: 'linear velocity'});
  PD.chart(document.getElementById('c4'), [{x: ks, y: D.pose_sigma.map(s => Math.max(s[0], s[1], s[2])), color: '#e6edf3', label: 'max σ τ_v (m)'}, {x: ks, y: D.pose_sigma.map(s => Math.max(s[3], s[4], s[5])), color: '#a371f7', label: 'max σ τ_ω (rad)'}], {title: 'pose uncertainty'});
  draw();
})();
</script></body></html>
