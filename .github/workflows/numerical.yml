name: Numerical covariance contract
on: [push, pull_request]
jobs:
  covariance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy pillow pyyaml
      - run: OPENBLAS_NUM_THREADS=1 python -B -m unittest discover -s tests -v
      - run: OPENBLAS_NUM_THREADS=1 python -B tests/report_numerics.py
